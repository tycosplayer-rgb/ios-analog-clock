name: AnalogClock
options:
  bundleIdPrefix: com.tycosplayer
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  localizations:
    - en
    - zh-Hans
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: 3C2T7V7382
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
targets:
  AnalogClock:
    type: application
    platform: iOS
    sources:
      - path: AnalogClock
        excludes:
          - Info.plist
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tycosplayer.analogclock
        PRODUCT_NAME: AnalogClock
        INFOPLIST_FILE: AnalogClock/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: 3C2T7V7382
        CODE_SIGN_STYLE: Automatic
        SUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: AnalogClock/Info.plist
      properties:
        CFBundleDisplayName: 模拟时钟
        UILaunchScreen: {}
        UIStatusBarHidden: true
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
schemes:
  AnalogClock:
    build:
      targets:
        AnalogClock: all
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    archive:
      config: Release
